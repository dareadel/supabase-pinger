name: Ping All Supabase Projects

on:
  workflow_dispatch:

jobs:
  ping_databases:
    runs-on: ubuntu-latest
    steps:
      - name: Reveal URL Structure
        run: |
          URL="${{ secrets.FITLEDGER_URL }}"
          # This masks your project ID but shows the domain ending
          MASKED_URL=$(echo "$URL" | sed 's/https:\/\/[^.]*/https:\/\/[HIDDEN_ID]/')
          echo "The runner is trying to connect to: $MASKED_URL"
