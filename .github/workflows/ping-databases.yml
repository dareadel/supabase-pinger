name: Ping All Supabase Projects

on:
  workflow_dispatch:

jobs:
  ping_databases:
    runs-on: ubuntu-latest
    steps:
      - name: Ultimate Diagnostic Test
        run: |
          URL_START=$(echo "${{ secrets.FITLEDGER_URL }}" | cut -c 1-5)
          echo "The FITLEDGER_URL secret starts with: $URL_START"
          
          if [ "$URL_START" = "eyJhb" ]; then
            echo "🚨 ALARM: That is an API Key, not a URL! The secrets are swapped."
          elif [ "$URL_START" = "https" ]; then
            echo "✅ It starts with https. The format is correct."
          else
            echo "⚠️ It starts with something else. Check the spelling."
          fi
