name: Ping All Supabase Projects

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping_databases:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FitLedger
        run: |
          CLEAN_URL=$(echo "${{ secrets.FITLEDGER_URL }}" | tr -d '[:space:]')
          
          # The '|| echo "000"' part stops the strict bash crash!
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.FITLEDGER_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.FITLEDGER_KEY }}" \
            "$CLEAN_URL/rest/v1/_keep_alive?select=*" || echo "000")
          
          echo "FitLedger Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: FitLedger returned status $STATUS (or failed to connect)"
            exit 0
          fi

      - name: Ping Events App
        run: |
          CLEAN_URL_EVENTS=$(echo "${{ secrets.EVENTS_URL }}" | tr -d '[:space:]')
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.EVENTS_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.EVENTS_KEY }}" \
            "$CLEAN_URL_EVENTS/rest/v1/_keep_alive?select=*" || echo "000")
          
          echo "Events Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Events App returned status $STATUS (or failed to connect)"
            exit 0
          fi
