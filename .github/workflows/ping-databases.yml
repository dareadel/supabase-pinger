# DEBUG VERSION: Checking secret visibility
name: Ping All Supabase Projects

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping_databases:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Secret Visibility
        run: |
          echo "Checking FitLedger URL..."
          echo "Value: ${{ secrets.FITLEDGER_URL }}"
          echo "If the line above just says 'Value: ' with nothing after it, the secret is empty!"

      - name: Ping FitLedger
        run: |
          curl -v -s -o /dev/null -w "\nFitLedger Status: %{http_code}\n" \
          -H "apikey: ${{ secrets.FITLEDGER_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.FITLEDGER_KEY }}" \
          "${{ secrets.FITLEDGER_URL }}/rest/v1/_keep_alive?select=*"

      - name: Ping Events App
        run: |
          curl -v -s -o /dev/null -w "\nEvents Status: %{http_code}\n" \
          -H "apikey: ${{ secrets.EVENTS_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.EVENTS_KEY }}" \
          "${{ secrets.EVENTS_URL }}/rest/v1/_keep_alive?select=*"
